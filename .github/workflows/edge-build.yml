name: Edge Build

# Builds TapeRot from develop on every push, runs the DSP test suite, packages a macOS installer
# (.pkg, AU+VST3+Standalone), a Windows installer (Inno Setup .exe, VST3+Standalone - no AU, that's
# Apple-only), and a Linux tarball (.tar.gz, VST3+Standalone - same reason), and publishes all three
# to the rolling "edge" pre-release. None are signed (no Apple Developer ID or Windows code-signing
# cert wired in, and no Linux equivalent exists) - recipients need to bypass Gatekeeper/SmartScreen
# once, or just extract-and-run on Linux.
# The three build jobs upload their packages as workflow artifacts; a final job downloads all of
# them and publishes them together in one release-action call, so no platform's asset ever gets
# wiped out by another's "replace previous assets" step.

# **PAUSED 2026-08-14 — the push trigger is commented out, not deleted.**
#
# The suite-wide bug sweep pushes to develop many times a day, and each push costs a full
# three-platform build and a rolling `edge` pre-release nobody is installing from during a
# measurement pass. The trigger is restored by uncommenting the two lines below; nothing else about
# this workflow changed, so a restore is a two-line diff rather than a reconstruction.
#
# `workflow_dispatch` stays, so an edge build is still available on demand from the Actions tab
# whenever one is actually wanted. Pausing it entirely would have meant losing that too.
#
# **Releases are unaffected.** release.yml triggers on `v*` tags, not on branches, so tagging still
# publishes exactly as before.
on:
  # push:
  #   branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (ad-hoc signing, universal arm64+x86_64)
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_STYLE=Manual \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="-" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=YES \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=YES

      - name: Build (AU/VST3/Standalone + tests)
        run: cmake --build build --config Release

      - name: Run DSP test suite
        run: ./build/Tests/TapeRotTests_artefacts/Release/TapeRotTests

      - name: Determine version/build identifiers
        id: version
        run: |
          VERSION=$(grep -oE 'VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -1 | awk '{print $2}')
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "pkg_name=TapeRot-${VERSION}-edge-${SHORT_SHA}-macos.pkg" >> "$GITHUB_OUTPUT"

      - name: Stage installer payload
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/pkgroot"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Applications" \
                   "$STAGE/Library/Audio/Plug-Ins/Components" \
                   "$STAGE/Library/Audio/Plug-Ins/VST3"
          cp -R build/TapeRot_artefacts/Release/Standalone/TapeRot.app \
                "$STAGE/Applications/"
          cp -R build/TapeRot_artefacts/Release/AU/TapeRot.component \
                "$STAGE/Library/Audio/Plug-Ins/Components/"
          cp -R build/TapeRot_artefacts/Release/VST3/TapeRot.vst3 \
                "$STAGE/Library/Audio/Plug-Ins/VST3/"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      # --component-plist with BundleIsRelocatable=NO is not optional here.
      #
      # pkgbuild marks .app bundles relocatable by default (pkgbuild --analyze reports
      # BundleIsRelocatable=true for TapeRot.app and no such key for the .vst3/.component). A
      # relocatable bundle tells Installer to look up an existing copy through LaunchServices and
      # install *over that*, rather than at the declared path - so on a machine that already has a
      # TapeRot.app anywhere (a previous install outside /Applications, or a build tree), the
      # update silently lands there and /Applications is never written.
      #
      # Measured, not assumed: packaging the same payload with and without this plist yields one
      # <relocate><bundle .../></relocate> entry versus an empty <relocate/>. Note the top-level
      # relocatable="false" attribute appears in *both* and does not govern the behaviour - the
      # contents of <relocate> do.
      - name: Build installer package
        run: |
          set -euo pipefail
          pkgbuild --analyze --root "$STAGE" components.plist
          python3 -c "
          import plistlib
          path = 'components.plist'
          with open(path, 'rb') as fh:
              components = plistlib.load(fh)
          for component in components:
              component['BundleIsRelocatable'] = False
          with open(path, 'wb') as fh:
              plistlib.dump(components, fh)
          "
          pkgbuild \
            --root "$STAGE" \
            --component-plist components.plist \
            --identifier com.neonfoundry.installer.taperot \
            --version "${{ steps.version.outputs.version }}" \
            --install-location / \
            "${{ steps.version.outputs.pkg_name }}"

      - name: Verify the package will not relocate itself
        run: |
          set -euo pipefail
          rm -rf pkgcheck && pkgutil --expand "${{ steps.version.outputs.pkg_name }}" pkgcheck
          if grep -q "<bundle id=" <(sed -n '/<relocate>/,/<\/relocate>/p' pkgcheck/PackageInfo); then
            echo "::error::PackageInfo still registers bundles for relocation - this pkg can install into ~/Library instead of /Library."
            sed -n '/<relocate>/,/<\/relocate>/p' pkgcheck/PackageInfo
            exit 1
          fi
          echo "relocation disabled; package installs to its declared paths"

      - name: Upload macOS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: ${{ steps.version.outputs.pkg_name }}
          retention-days: 7

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Configure/build/test run in the runner's native shell (pwsh) rather than bash - CMake's
      # Visual Studio generator locates VS via vswhere.exe internally, which is unreliable when
      # invoked from Git Bash on these runners (a known gotcha, not specific to this project).
      #
      # No explicit -G: hardcoding e.g. "Visual Studio 17 2022" breaks the moment GitHub rolls
      # windows-latest onto a new VS version (which is exactly what just happened - this runner
      # now ships VS2026, not VS2022). Omitting -G lets CMake auto-detect whichever VS is actually
      # installed and pick the matching generator itself; -A x64 still applies to that default.
      - name: Configure
        run: cmake -B build -A x64

      - name: Build (VST3/Standalone + tests)
        run: cmake --build build --config Release

      - name: Run DSP test suite
        run: .\build\Tests\TapeRotTests_artefacts\Release\TapeRotTests.exe

      - name: Determine version/build identifiers
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oE 'VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -1 | awk '{print $2}')
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "installer_name=TapeRot-${VERSION}-edge-${SHORT_SHA}-windows" >> "$GITHUB_OUTPUT"

      - name: Stage build output
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/VST3" "$STAGE/Standalone"
          cp -R build/TapeRot_artefacts/Release/VST3/TapeRot.vst3 "$STAGE/VST3/"
          cp build/TapeRot_artefacts/Release/Standalone/TapeRot.exe "$STAGE/Standalone/"
          # The embedded fonts' licences. The VST3 bundle carries its own copy from CMake; the
          # Standalone off Apple is a bare .exe with no bundle, so the installer places this one.
          cp THIRD-PARTY-LICENCES.txt "$STAGE/"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            "/DMyOutputBaseFilename=${{ steps.version.outputs.installer_name }}" `
            "/DMyStageDir=$env:STAGE" `
            /O. `
            installer\windows\TapeRot.iss

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ${{ steps.version.outputs.installer_name }}.exe
          retention-days: 7

  build-linux:
    # Pinned to 22.04 rather than ubuntu-latest for an older glibc baseline - broader binary
    # compatibility with users' possibly-older distros/library versions.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JUCE Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev \
            libcurl4-openssl-dev \
            libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev

      # Single-config generator (Makefiles/Ninja) - CMAKE_BUILD_TYPE must be set at configure time,
      # unlike the Xcode/Visual Studio multi-config generators used on macOS/Windows.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      # Capped at 2 parallel jobs rather than the default (one per core, 4 on this runner) -
      # JUCE's amalgamated per-module translation units (juce_dsp.cpp, juce_gui_basics.cpp, etc.)
      # are heavy enough per-TU that building several concurrently OOM-killed cc1plus on this
      # runner's 16GB with full parallelism.
      - name: Build (VST3/Standalone + tests)
        run: cmake --build build --config Release --parallel 2

      - name: Run DSP test suite
        run: ./build/Tests/TapeRotTests_artefacts/Release/TapeRotTests

      - name: Determine version/build identifiers
        id: version
        run: |
          VERSION=$(grep -oE 'VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -1 | awk '{print $2}')
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "archive_name=TapeRot-${VERSION}-edge-${SHORT_SHA}-linux.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Stage tarball payload
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/VST3" "$STAGE/Standalone"
          cp -R build/TapeRot_artefacts/Release/VST3/TapeRot.vst3 "$STAGE/VST3/"
          cp build/TapeRot_artefacts/Release/Standalone/TapeRot "$STAGE/Standalone/"
          cp installer/linux/README.txt "$STAGE/"
          # Same reason as the Windows stage: the .vst3 carries its own copy, the bare Standalone
          # binary cannot, so the tarball root carries one for the whole archive.
          cp THIRD-PARTY-LICENCES.txt "$STAGE/"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      - name: Build tarball
        run: tar czf "${{ steps.version.outputs.archive_name }}" -C "$STAGE" .

      - name: Upload Linux installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: ${{ steps.version.outputs.archive_name }}
          retention-days: 7

  publish-edge:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Determine short SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish rolling edge pre-release
        uses: ncipollo/release-action@v1
        with:
          tag: edge
          name: "Edge build (${{ steps.sha.outputs.short_sha }})"
          body: |
            Automatic bleeding-edge build from `develop` @ ${{ steps.sha.outputs.short_sha }}.
            None of these are signed (no Apple Developer ID or Windows code-signing cert wired in
            yet, and no Linux equivalent exists), so expect first-run friction:

            - **macOS**: right-click the `.pkg` and choose Open, or run
              `xattr -dr com.apple.quarantine ~/Downloads/TapeRot-*-macos.pkg`
            - **Windows**: SmartScreen will show "Windows protected your PC" on the installer -
              click "More info" then "Run anyway". The installer needs admin rights (it places the
              VST3 in the shared Common Files location) and installs both the VST3 and Standalone.
            - **Linux**: no signing/quarantine step needed - extract the `.tar.gz` and follow the
              included README.txt to copy the VST3 into `~/.vst3` (or system-wide) and run the
              Standalone directly.
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          artifacts: "dist/*.pkg,dist/*.exe,dist/*.tar.gz"
          token: ${{ secrets.GITHUB_TOKEN }}
