name: Release

# Tag-triggered release build for TapeRot.
#
# Publishes RAW PLUGIN BUNDLES, not installers. The Neon Foundry suite installer pins a version of
# each plugin and fetches these archives at build time; per-plugin installers are generated from the
# same artifacts rather than being built here, so every installer agrees on component identifiers
# and file ownership by construction instead of by review discipline.
#
# To cut a release, bump the project() version in CMakeLists.txt, then:
#     git tag v0.2.0 && git push origin v0.2.0
#
# workflow_dispatch runs everything except the publish step, so the whole pipeline can be verified
# without minting a tag that has to be deleted again if it fails.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # The three name axes. They are NOT interchangeable, and assuming they are is the single easiest
  # way to break one of these workflows when copying it to another plugin:
  #   CMAKE_TARGET  - the CMake target, and therefore the <target>_artefacts/ directory name
  #   PRODUCT_NAME  - JUCE's PRODUCT_NAME, and therefore the bundle filenames on disk
  #   TEST_TARGET   - the console-app target holding the DSP suite
  # They diverge whenever the brand name isn't a legal CMake identifier: CHORUS-60 builds from
  # target Chorus60 but produces CHORUS-60.vst3.
  CMAKE_TARGET: TapeRot
  PRODUCT_NAME: TapeRot
  TEST_TARGET: TapeRotTests

jobs:
  version:
    # Deliberately its own job ahead of the builds: a tag that disagrees with CMakeLists.txt should
    # fail in about fifteen seconds, not after three full plugin builds have run.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and verify version
        id: v
        run: |
          set -euo pipefail
          # Anchored to the project() line rather than grepping for a bare "VERSION x.y.z": the
          # loose form would also match cmake_minimum_required(VERSION 3.x.y) the moment anyone
          # added a patch component there, and would then silently release the wrong number.
          CMAKE_VERSION=$(grep -oE '^project\([A-Za-z0-9_-]+ VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt \
                          | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+$' || true)
          if [ -z "$CMAKE_VERSION" ]; then
            echo "::error::Could not parse a version from the project() line in CMakeLists.txt."
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"

            # **Compare the RELEASE portion, because CMake cannot express a pre-release.**
            # `project(VERSION)` takes numeric components only, so a casting declaring 1.0.0 can
            # never declare 1.0.0-rc.1 — and comparing the whole tag would reject every pre-release
            # tag this project will ever cut. `${VAR%%-*}` takes everything before the first hyphen,
            # which is exactly semver's release portion.
            TAG_CORE="${TAG_VERSION%%-*}"

            # The pre-release test is the HYPHEN, per semver — not a list of suffixes to maintain.
            # `rc.N` is dotted so rc.2 sorts below rc.10.
            case "$TAG_VERSION" in
              *-*) PRERELEASE=true ;;
              *)   PRERELEASE=false ;;
            esac

            if [ "$TAG_CORE" != "$CMAKE_VERSION" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} declares ${TAG_CORE} (from ${TAG_VERSION}) but CMakeLists.txt declares ${CMAKE_VERSION}. Bump project() or retag - the suite installer pins these by version and cannot tell them apart otherwise."
              exit 1
            fi
            # The FULL tag version, suffix included: it names the artefacts and the release, and
            # the suite manifest pins by exactly this string.
            echo "version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"
            echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=${CMAKE_VERSION}-dev.${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  build-macos:
    needs: version
    outputs:
      suites: ${{ steps.tests.outputs.suites }}
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Note the absence of -DCMAKE_OSX_ARCHITECTURES. That is deliberate: the architecture list
      # belongs in CMakeLists.txt (where it must appear *before* project(), or the cache entry
      # already exists and the set() is a silent no-op). Passing it here would paper over any
      # regression in that setting - which is precisely how a green run once published an
      # arm64-only package. The "Verify universal" step below is the real gate.
      - name: Configure (ad-hoc signing; architectures come from CMakeLists.txt)
        run: |
          cmake -B build -G Xcode \
            -DNF_COPY_PLUGIN_AFTER_BUILD=OFF \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_STYLE=Manual \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="-" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=YES \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=YES

      - name: Build (AU/VST3/Standalone + tests)
        run: |
          set +e
          cmake --build build --config Release 2>&1 | tee build-output.txt
          exit ${PIPESTATUS[0]}

      # **THE WARNING CLASSES ARE BASELINED BY CLASS, and a class nobody named fails.**
      #
      # `/we4566` and friends detect classes that have already cost a finding — instance one, by
      # name. They cannot reach a class nobody has thought of, because the list is written from what
      # is already known. This table is the other half: a new class appears as a NEW ROW and fails.
      #
      # It also absorbs the EXISTING population visibly. A single warning count would have taken its
      # baseline from today's output and swallowed the 168 C4566 as part of one number; per class
      # they are one line in a file somebody had to write, which is where they get noticed.
      #
      # `always()` so a failing build still has its warnings read — that is the case where a new
      # class is most likely and least likely to be looked at.
      - name: Warning classes at baseline
        if: always()
        shell: bash
        run: |
          python3 build/_deps/neonfoundrycore-src/tools/check_warning_baseline.py \
            macos build-output.txt ci/warning-baseline.json

      - name: Run DSP test suite
        id: tests
        run: |
          set +e
          ./build/Tests/${TEST_TARGET}_artefacts/Release/${TEST_TARGET} 2>&1 | tee test-output.txt
          RC=${PIPESTATUS[0]}
          echo "suites=$(grep -c 'Starting tests in' test-output.txt)" >> "$GITHUB_OUTPUT"
          exit $RC

      - name: Stage raw bundles
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/bundles"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/VST3" "$STAGE/AU" "$STAGE/Standalone"
          A="build/${CMAKE_TARGET}_artefacts/Release"
          cp -R "$A/VST3/${PRODUCT_NAME}.vst3"      "$STAGE/VST3/"
          cp -R "$A/AU/${PRODUCT_NAME}.component"   "$STAGE/AU/"
          cp -R "$A/Standalone/${PRODUCT_NAME}.app" "$STAGE/Standalone/"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      # An automated gate rather than a manual spot-check. A missing x86_64 slice is invisible
      # locally, survives a fully green build, and only surfaces when an Intel user reports the
      # plugin won't load at all - Rosetta does not bridge audio plugins into an arm64 host.
      - name: Verify universal (arm64 + x86_64)
        run: |
          set -euo pipefail
          fail=0
          for macho in \
            "$STAGE/VST3/${PRODUCT_NAME}.vst3/Contents/MacOS/${PRODUCT_NAME}" \
            "$STAGE/AU/${PRODUCT_NAME}.component/Contents/MacOS/${PRODUCT_NAME}" \
            "$STAGE/Standalone/${PRODUCT_NAME}.app/Contents/MacOS/${PRODUCT_NAME}"; do
            rel="${macho#"$STAGE/"}"
            if [ ! -f "$macho" ]; then
              echo "::error::Expected Mach-O missing: ${rel}"
              fail=1
              continue
            fi
            archs=$(lipo -info "$macho" | sed 's/.*: //')
            for want in arm64 x86_64; do
              case " ${archs} " in
                *" ${want} "*) ;;
                *) echo "::error::${rel} has no ${want} slice (found: ${archs})"; fail=1 ;;
              esac
            done
            echo "  ${archs}  <-  ${rel}"
          done
          exit $fail

      # tar, not zip: zip does not reliably preserve the Unix executable bit or extended attributes,
      # and a bundle whose Mach-O comes back without +x simply will not load.
      #
      # An earlier version of the check below asserted the archive contained symlinks. That was
      # wrong and failed every run: *framework* bundles carry symlinks (Versions/Current and
      # friends), but JUCE's .vst3/.component/.app are flat Contents/ trees with none at all. The
      # replacement asserts the property actually worth guarding - that what comes back out of the
      # archive is still a structurally valid, executable, universal bundle.
      - name: Archive bundles
        run: |
          set -euo pipefail
          NAME="${PRODUCT_NAME}-${{ needs.version.outputs.version }}-macos-bundles.tar.gz"
          tar czf "$NAME" -C "$STAGE" .
          echo "ARCHIVE=$NAME" >> "$GITHUB_ENV"

      - name: Verify the archive round-trips to a loadable bundle
        run: |
          set -euo pipefail
          RT="$RUNNER_TEMP/roundtrip"
          rm -rf "$RT"; mkdir -p "$RT"
          tar xzf "$ARCHIVE" -C "$RT"
          fail=0
          for rel in "VST3/${PRODUCT_NAME}.vst3" \
                     "AU/${PRODUCT_NAME}.component" \
                     "Standalone/${PRODUCT_NAME}.app"; do
            macho="$RT/$rel/Contents/MacOS/${PRODUCT_NAME}"
            if [ ! -f "$RT/$rel/Contents/Info.plist" ]; then
              echo "::error::${rel}: Contents/Info.plist missing after extraction"
              fail=1
            fi
            if [ ! -x "$macho" ]; then
              echo "::error::${rel}: Contents/MacOS/${PRODUCT_NAME} missing or not executable after extraction"
              fail=1
              continue
            fi
            archs=$(lipo -info "$macho" | sed 's/.*: //')
            for want in arm64 x86_64; do
              case " ${archs} " in
                *" ${want} "*) ;;
                *) echo "::error::${rel}: lost the ${want} slice in archiving (found: ${archs})"; fail=1 ;;
              esac
            done
            echo "  ok  ${rel}  (${archs})"
          done
          exit $fail

      - uses: actions/upload-artifact@v4
        with:
          name: macos-bundles
          path: ${{ env.PRODUCT_NAME }}-${{ needs.version.outputs.version }}-macos-bundles.tar.gz
          retention-days: 14

  build-windows:
    needs: version
    outputs:
      suites: ${{ steps.tests.outputs.suites }}
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      # Configure/build/test run in the runner's native pwsh: CMake's Visual Studio generator finds
      # VS through vswhere.exe internally, which is unreliable when invoked from Git Bash here.
      #
      # No explicit -G. Hardcoding "Visual Studio 17 2022" breaks the moment GitHub rolls
      # windows-latest forward (it has already moved to VS2026); omitting -G lets CMake detect
      # whatever VS is installed, and -A x64 still applies to that generator.
      - name: Configure
        run: cmake -B build -A x64 -DNF_COPY_PLUGIN_AFTER_BUILD=OFF

      - name: Build (VST3/Standalone + tests)
        run: |
          set +e
          cmake --build build --config Release 2>&1 | tee build-output.txt
          exit ${PIPESTATUS[0]}

      # **THE WARNING CLASSES ARE BASELINED BY CLASS, and a class nobody named fails.**
      #
      # `/we4566` and friends detect classes that have already cost a finding — instance one, by
      # name. They cannot reach a class nobody has thought of, because the list is written from what
      # is already known. This table is the other half: a new class appears as a NEW ROW and fails.
      #
      # It also absorbs the EXISTING population visibly. A single warning count would have taken its
      # baseline from today's output and swallowed the 168 C4566 as part of one number; per class
      # they are one line in a file somebody had to write, which is where they get noticed.
      #
      # `always()` so a failing build still has its warnings read — that is the case where a new
      # class is most likely and least likely to be looked at.
      - name: Warning classes at baseline
        if: always()
        shell: bash
        run: |
          python3 build/_deps/neonfoundrycore-src/tools/check_warning_baseline.py \
            windows build-output.txt ci/warning-baseline.json

      - name: Run DSP test suite
        id: tests
        # $(...) rather than bare ${env:X}: the variable is immediately followed by literal text
        # ("_artefacts"), which PowerShell would otherwise read as part of the variable name.
        run: |
          & ".\build\Tests\$($env:TEST_TARGET)_artefacts\Release\$($env:TEST_TARGET).exe" 2>&1 |
            Tee-Object -FilePath test-output.txt
          $rc = $LASTEXITCODE
          $n = (Select-String -Path test-output.txt -Pattern 'Starting tests in').Count
          "suites=$n" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          exit $rc

      - name: Stage raw bundles
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/bundles"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/VST3" "$STAGE/Standalone"
          A="build/${CMAKE_TARGET}_artefacts/Release"
          # No AU on this platform - it is an Apple-only format.
          cp -R "$A/VST3/${PRODUCT_NAME}.vst3"     "$STAGE/VST3/"
          cp    "$A/Standalone/${PRODUCT_NAME}.exe" "$STAGE/Standalone/"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      # zip is correct here (unlike macOS): Windows VST3 bundles are plain directories with no
      # symlinks, and zip is what every Windows consumer expects to be handed.
      - name: Archive bundles
        shell: pwsh
        run: |
          $name = "${env:PRODUCT_NAME}-${{ needs.version.outputs.version }}-windows-bundles.zip"
          Compress-Archive -Path "${env:STAGE}\*" -DestinationPath $name

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: ${{ env.PRODUCT_NAME }}-${{ needs.version.outputs.version }}-windows-bundles.zip
          retention-days: 14

  build-linux:
    needs: version
    outputs:
      suites: ${{ steps.tests.outputs.suites }}
    # Pinned to 22.04 rather than ubuntu-latest for an older glibc baseline, so the binaries load on
    # users' older distributions.
    runs-on: ubuntu-22.04
    # A hung test step is a stall, not a failure, so without this it runs to GitHub's 6-hour
    # limit before anyone learns anything. 45 minutes is generous against a ~12-minute build.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install JUCE Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev \
            libcurl4-openssl-dev \
            libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev

      # Single-config generator: CMAKE_BUILD_TYPE must be set at configure time, unlike the
      # Xcode/Visual Studio multi-config generators used above.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DNF_COPY_PLUGIN_AFTER_BUILD=OFF

      # Capped at 2 jobs rather than one-per-core. JUCE's amalgamated per-module translation units
      # (juce_dsp.cpp, juce_gui_basics.cpp, ...) are heavy enough that building several at once
      # OOM-killed cc1plus on this runner's memory.
      - name: Build (VST3/Standalone + tests)
        run: |
          set +e
          cmake --build build --config Release --parallel 2 2>&1 | tee build-output.txt
          exit ${PIPESTATUS[0]}

      # **THE WARNING CLASSES ARE BASELINED BY CLASS, and a class nobody named fails.**
      #
      # `/we4566` and friends detect classes that have already cost a finding — instance one, by
      # name. They cannot reach a class nobody has thought of, because the list is written from what
      # is already known. This table is the other half: a new class appears as a NEW ROW and fails.
      #
      # It also absorbs the EXISTING population visibly. A single warning count would have taken its
      # baseline from today's output and swallowed the 168 C4566 as part of one number; per class
      # they are one line in a file somebody had to write, which is where they get noticed.
      #
      # `always()` so a failing build still has its warnings read — that is the case where a new
      # class is most likely and least likely to be looked at.
      - name: Warning classes at baseline
        if: always()
        shell: bash
        run: |
          python3 build/_deps/neonfoundrycore-src/tools/check_warning_baseline.py \
            linux build-output.txt ci/warning-baseline.json

      # **NO DISPLAY IS NEEDED, AND THE COMMENT THAT USED TO SIT HERE SAID OTHERWISE.**
      #
      # xvfb was added on the theory that `ScopedJuceInitialiser_GUI` blocked on an X11 connection.
      # The stall was our own malloc interposition recursing during `_dl_init` — before `main`, so
      # the initialiser was never reached and the display was never the question. Fixed in
      # neon-foundry-core; a clean A/B differing only in the display then exited 0 on BOTH arms
      # (elmer 32816655867).
      #
      # The initialiser itself is not optional: three castings' Program tests once passed while
      # proving nothing without it, and `run_tests.py` refuses a target that lacks it.
      - name: Run DSP test suite
        id: tests
        run: |
          set +e
          ./build/Tests/${TEST_TARGET}_artefacts/Release/${TEST_TARGET} 2>&1 | tee test-output.txt
          RC=${PIPESTATUS[0]}
          echo "suites=$(grep -c 'Starting tests in' test-output.txt)" >> "$GITHUB_OUTPUT"
          exit $RC

      - name: Stage raw bundles
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/bundles"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/VST3" "$STAGE/Standalone"
          A="build/${CMAKE_TARGET}_artefacts/Release"
          # No AU on this platform - it is an Apple-only format.
          cp -R "$A/VST3/${PRODUCT_NAME}.vst3"  "$STAGE/VST3/"
          cp    "$A/Standalone/${PRODUCT_NAME}" "$STAGE/Standalone/"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      - name: Archive bundles
        run: tar czf "${PRODUCT_NAME}-${{ needs.version.outputs.version }}-linux-bundles.tar.gz" -C "$STAGE" .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: ${{ env.PRODUCT_NAME }}-${{ needs.version.outputs.version }}-linux-bundles.tar.gz
          retention-days: 14

  # **THE SUITE COUNTS MUST AGREE, AND A ZERO IS NOT AGREEMENT.**
  #
  # Elmer's Windows step printed 8 lines against macOS's 94 — no `Random seed`, no `Starting tests
  # in` — and the job was green, for the whole history of this suite. JUCE's default logger writes
  # to OutputDebugString on Windows, so every line went to a debugger and nowhere else. The tests
  # were running; nothing said so.
  #
  # **The two numbers were in one run's output, side by side, and nothing compared them.** That is
  # the same free signal the closed-cell CPU rule is about, and the class has now cost two findings.
  # One job, three strings, no fixture.
  #
  # The `> 0` arm is the vacuity guard: three platforms reporting zero AGREE, and agreeing about
  # nothing is exactly the state this exists to catch.
  suite-parity:
    name: Suite counts agree across platforms
    needs: [build-macos, build-windows, build-linux]
    # **`always()`, because `needs` alone skips this exactly where it matters most.**
    #
    # A casting with a documented open arm CANNOT go green — reflect-84 has one, taperot has five —
    # and for those the Stage 2 criterion IS that the three platforms fail in the same places and
    # nowhere else. Gated on the build jobs succeeding, this job never runs on them: disarmed on the
    # two castings whose whole criterion is agreement.
    #
    # A platform that never reached its test step reports no count, and the guard below fails on
    # that rather than comparing three blanks — which is the same vacuity arm, doing its job.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Compare
        run: |
          M="${{ needs.build-macos.outputs.suites }}"
          W="${{ needs.build-windows.outputs.suites }}"
          L="${{ needs.build-linux.outputs.suites }}"
          echo "macOS $M   Windows $W   Linux $L"

          for v in "$M" "$W" "$L"; do
            case "$v" in
              ''|*[!0-9]*) echo "::error::a platform reported no suite count at all"; exit 1 ;;
            esac
            [ "$v" -gt 0 ] || { echo "::error::a platform ran 0 suites — green with no evidence"; exit 1; }
          done

          [ "$M" = "$W" ] && [ "$W" = "$L" ] \
            || { echo "::error::suite counts differ — a platform is not running what the others are"; exit 1; }
          echo "all three platforms ran $M suites"

  publish:
    # Skipped on workflow_dispatch: a manual run is for verifying the pipeline, not for releasing.
    if: needs.version.outputs.publish == 'true'
    needs: [version, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download built bundles
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The suite installer fetches these archives by pinned version at build time. Checksums are
      # what let it verify it received the bytes this release actually published, rather than
      # trusting whatever the URL happens to serve later.
      - name: Generate checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: "${{ env.PRODUCT_NAME }} ${{ needs.version.outputs.version }}"
          body: |
            > **This is a release-candidate build of unreleased software, published to
            > exercise the release pipeline.** It is not a product announcement and nothing here
            > has shipped. The tag and this release are expected to be deleted once the pipeline
            > has been proven end to end.

            Raw plugin bundles for **${{ env.PRODUCT_NAME }} ${{ needs.version.outputs.version }}**.

            These are the unpackaged plugin bundles, not an installer - they are what the Neon
            Foundry suite installer consumes. If you are looking for something to double-click,
            use the Neon Foundry installer instead.

            | Archive | Contains |
            |---|---|
            | `*-macos-bundles.tar.gz` | AU, VST3, Standalone (universal: arm64 + x86_64) |
            | `*-windows-bundles.zip` | VST3, Standalone (x64) |
            | `*-linux-bundles.tar.gz` | VST3, Standalone (x86_64, glibc from Ubuntu 22.04) |

            Verify with `sha256sum -c SHA256SUMS.txt`.

            Nothing here is signed or notarized, so installing manually means clearing the
            quarantine attribute on macOS (`xattr -dr com.apple.quarantine <bundle>`).
          prerelease: ${{ needs.version.outputs.prerelease }}
          artifacts: "dist/*"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
